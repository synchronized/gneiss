name: Windows

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "all 为完整矩阵；editor 仅验证 Editor/Runtime 相关修改"
        type: choice
        default: all
        options: [all, editor]

permissions:
  contents: read

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  installed-consumer:
    if: ${{ inputs.scope != 'editor' }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        linkage: [shared, static]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: 选择 preset
        id: preset
        shell: pwsh
        run: |
          $suffix = if ('${{ matrix.linkage }}' -eq 'static') { '-static' } else { '' }
          "name=windows-vs2022${suffix}-release" >> $env:GITHUB_OUTPUT
      - name: 验证安装后 C/C++ Consumer
        shell: pwsh
        run: |
          cmake --preset '${{ steps.preset.outputs.name }}' `
            -DGNEISS_BUILD_EXAMPLES=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset '${{ steps.preset.outputs.name }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --preset '${{ steps.preset.outputs.name }}' `
            -R '^gneiss\.installed_consumer$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/performance/test_prepare_sponza.py

  msvc-runtime:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        linkage: [shared, static]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: 启用 MSVC 编译缓存
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: 选择 preset
        id: preset
        shell: pwsh
        run: |
          $suffix = if ('${{ matrix.linkage }}' -eq 'static') { '-static' } else { '' }
          "name=windows-vs2022${suffix}-release" >> $env:GITHUB_OUTPUT
      - name: 配置、构建与测试
        shell: pwsh
        run: |
          cmake --preset '${{ steps.preset.outputs.name }}' `
            -DGNEISS_ENABLE_GRANIT_PLATFORM=ON `
            -DGNEISS_BUILD_RUNTIME=ON `
            -DGNEISS_BUILD_EDITOR=ON `
            -DGNEISS_GRANIT_PROVIDER=FETCH `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset '${{ steps.preset.outputs.name }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 托管 Windows Runner 没有 Vulkan ICD；Linux 矩阵负责真实窗口与图形示例 smoke test。
          # Editor 全量编译；仅排除创建真实图形设备的工作流，CPU 模型与 ImGui 交互仍执行。
          ctest --preset '${{ steps.preset.outputs.name }}' `
            -E '^gneiss\.(asset-pixel|pbr-negative-scale|main-loop-response|granit_platform_smoke|stable_runtime_example|temple_example|lantern_gallery_example|installed_stable_runtime_consumer|editor\.(native-window-interaction|runtime-process|runtime-scene-loading|asset-workflow|smoke|project-manager-smoke|lantern-gallery-project|lantern-runtime-workflow)|runtime\.(project-game-module|smoke|installed-smoke|stop-protocol|lantern-gallery|lantern-cooked-textures))$'
