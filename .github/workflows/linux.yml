name: Linux

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "all 为完整矩阵；editor 仅验证 Editor/Runtime 相关修改"
        type: choice
        default: all
        options: [all, editor]

permissions:
  contents: read
  packages: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 500M

jobs:
  task-web:
    if: ${{ inputs.scope != 'editor' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: 安装固定 Emscripten 工具链
        shell: bash
        run: |
          git clone --depth 1 --branch 5.0.6 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 5.0.6
          "$RUNNER_TEMP/emsdk/emsdk" activate 5.0.6
      - name: 验证无线程浏览器调度
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S tests/task_web -B build/task-web -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/task-web
          google-chrome --version
          python3 tests/task_web/run_browser.py --build build/task-web --browser "$(command -v google-chrome)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-web-browser
          path: |
            build/task-web/browser-dom.html
            build/task-web/browser.log

  core:
    if: ${{ inputs.scope != 'editor' }}
    runs-on: ubuntu-24.04
    container:
      image: >-
        ghcr.io/synchronized/granit-ci@sha256:6a2d0aba3b2464838958a4259d3a343106205eb35df9f4ad24d060bf98739015
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
        linkage: [shared, static]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: 恢复编译缓存
        uses: actions/cache@v5
        with:
          path: .cache/ccache
          key: >-
            linux-core-${{ matrix.compiler }}-${{ matrix.linkage }}-${{ github.sha }}
          restore-keys: |
            linux-core-${{ matrix.compiler }}-${{ matrix.linkage }}-
      - name: 选择 preset
        id: preset
        shell: bash
        run: |
          suffix=""
          if [[ "${{ matrix.linkage }}" == "static" ]]; then suffix="-static"; fi
          echo "name=linux-${{ matrix.compiler }}${suffix}-release" >> "$GITHUB_OUTPUT"
      - name: 配置、构建与测试
        shell: bash
        run: |
          ccache --zero-stats
          cmake --preset "${{ steps.preset.outputs.name }}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset "${{ steps.preset.outputs.name }}"
          ctest --preset "${{ steps.preset.outputs.name }}"
          python3 -B scripts/performance/test_prepare_sponza.py
          python3 -B scripts/performance/test_validate_runtime_loop.py
      - name: 输出编译缓存统计
        if: always()
        shell: bash
        run: ccache --show-stats

  granit-runtime:
    runs-on: ubuntu-24.04
    container:
      image: >-
        ghcr.io/synchronized/granit-ci@sha256:6a2d0aba3b2464838958a4259d3a343106205eb35df9f4ad24d060bf98739015
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        linkage: [shared, static]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: 恢复编译缓存
        uses: actions/cache@v5
        with:
          path: .cache/ccache
          key: linux-runtime-clang-${{ matrix.linkage }}-${{ github.sha }}
          restore-keys: |
            linux-runtime-clang-${{ matrix.linkage }}-
      - name: 恢复第三方依赖缓存
        uses: actions/cache@v5
        with:
          path: .cache/fetchcontent
          key: linux-runtime-fetch-${{ hashFiles('cmake/*.cmake') }}
      - name: 选择 preset
        id: preset
        shell: bash
        run: |
          suffix=""
          if [[ "${{ matrix.linkage }}" == "static" ]]; then suffix="-static"; fi
          echo "name=linux-clang${suffix}-release" >> "$GITHUB_OUTPUT"
      - name: 配置并构建 Granit 运行时
        shell: bash
        run: |
          ccache --zero-stats
          cmake --preset "${{ steps.preset.outputs.name }}" \
            -DGNEISS_ENABLE_GRANIT_PLATFORM=ON \
            -DGNEISS_BUILD_EDITOR=ON \
            -DGNEISS_BUILD_RUNTIME=ON \
            -DGNEISS_GRANIT_PROVIDER=FETCH \
            -DFETCHCONTENT_BASE_DIR="$GITHUB_WORKSPACE/.cache/fetchcontent" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build --preset "${{ steps.preset.outputs.name }}"
      - name: 运行无头窗口测试
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/gneiss-wayland"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=gneiss-wayland
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            >"$RUNNER_TEMP/gneiss-weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] && break
            sleep 0.1
          done
          [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] || {
            cat "$RUNNER_TEMP/gneiss-weston.log"
            exit 1
          }
          if [[ ! -f /usr/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json ]]; then
            apt-get update && apt-get install -y vulkan-validationlayers
          fi
          test -f /usr/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json
          if ! xvfb-run -a ctest --preset "${{ steps.preset.outputs.name }}"; then
            # 保留测试失败，同时收集像素回归的原生崩溃栈。
            if ! command -v gdb >/dev/null; then
              apt-get update && apt-get install -y gdb
            fi
            xvfb-run -a gdb --batch -ex run -ex 'thread apply all bt 20' --args \
              "build/${{ steps.preset.outputs.name }}/bin/gneiss_asset_pixel_test" || true
            exit 1
          fi
          # 退出成功不代表 Vulkan 使用合法；完整像素回归还必须没有校验错误。
          validation_log="build/${{ steps.preset.outputs.name }}/pbr-validation.log"
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation xvfb-run -a \
            "build/${{ steps.preset.outputs.name }}/bin/gneiss_asset_pixel_test" \
            >"$validation_log" 2>&1
          cat "$validation_log"
          ! grep -E 'Validation Error|VUID-' "$validation_log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pbr-validation-${{ matrix.linkage }}
          path: build/${{ steps.preset.outputs.name }}/pbr-validation.log
      - name: 输出编译缓存统计
        if: always()
        shell: bash
        run: ccache --show-stats

  sanitizer-runtime:
    if: ${{ inputs.scope != 'editor' }}
    runs-on: ubuntu-24.04
    container:
      image: >-
        ghcr.io/synchronized/granit-ci@sha256:6a2d0aba3b2464838958a4259d3a343106205eb35df9f4ad24d060bf98739015
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: 配置并构建 Sanitizer 运行时
        shell: bash
        run: |
          cmake --preset linux-gcc-debug \
            -DGNEISS_ENABLE_GRANIT_PLATFORM=ON \
            -DGNEISS_BUILD_EDITOR=OFF \
            -DGNEISS_BUILD_TOOLS=OFF \
            -DGNEISS_ENABLE_SANITIZERS=ON \
            -DGNEISS_GRANIT_PROVIDER=FETCH
          cmake --build --preset linux-gcc-debug \
            --target gneiss_stable_runtime_example gneiss_scene_instance_test gneiss_c_application_test \
              gneiss_scene_load_application_test gneiss_scene_load_preparation_test \
              gneiss_scene_load_builder_test gneiss_source_revision_test \
              gneiss_texture_load_service_test gneiss_render_asset_loader_test gneiss_prefab_runtime_instance_test
      - name: 检查内存错误与退出泄漏
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/gneiss-wayland"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=gneiss-wayland
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 \
            >"$RUNNER_TEMP/gneiss-weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] && break
            sleep 0.1
          done
          [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] || {
            cat "$RUNNER_TEMP/gneiss-weston.log"
            exit 1
          }
          set +e
          device_failure_output=$(
            VK_ICD_FILENAMES="$RUNNER_TEMP/missing-vulkan-icd.json" \
              "$PWD/build/linux-gcc-debug/bin/gneiss_stable_runtime_example" --smoke 2>&1
          )
          device_failure_status=$?
          set -e
          printf '%s\n' "$device_failure_output"
          [[ "$device_failure_status" -ne 0 ]]
          grep -F '阶段=创建 Application，结果=-5' <<<"$device_failure_output"
          ctest --preset linux-gcc-debug \
            -R '^gneiss\.(c_application|scene_instance|scene-load-application|scene-load-preparation|scene-load-builder|source-revision|texture-load-service|render_asset_loader|prefab_runtime_instance)$'
          ASAN_OPTIONS=detect_leaks=0:halt_on_error=1:strict_string_checks=1 \
            xvfb-run -a ctest --preset linux-gcc-debug \
            -R '^gneiss\.stable_runtime_example$'
